networks:
  wordpot_local:

services:

# Wordpot service
  wordpot:
    build: .
    container_name: wordpot
    restart: always
#    cpu_count: 1
#    cpus: 0.25
    networks:
     - wordpot_local
    ports:
     - "80:80"
    image: "dtagdevsec/wordpot:3.0.1"
    read_only: true
    cap_drop:
     - ALL
    cap_add:
     - NET_BIND_SERVICE
    security_opt:
     - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    tmpfs:
     - /tmp:rw,noexec,nosuid,size=16m
    volumes:
     - $HOME/tpotce/data/wordpot/log:/opt/wordpot/logs/
