# ----------------------
# Honeypot configuration
# ----------------------

HOST        = '127.0.0.1'           # Hostname
PORT        = '80'                  # Port
THEME       = 'twentytwentyfive'    # Fallback theme name
SERVER      = 'Apache/2.4.58 (Ubuntu)'   # Fallback server header

# How deeply Wordpot should interact with probes. "medium" captures GET, POST,
# REST, XML-RPC, admin-ajax, login, and upload payloads without executing them.
INTERACTION_DEPTH = 'medium'

# Safety limits. Bodies above MAX_CONTENT_LENGTH are rejected. Captured payloads
# are hashed in full, only PAYLOAD_EXCERPT_BYTES bytes are stored inline in
# EVENT_LOG_FILE, and raw bodies are spooled below PAYLOAD_DIR when enabled.
MAX_CONTENT_LENGTH = 65536
PAYLOAD_EXCERPT_BYTES = 4096
PAYLOAD_STORAGE_ENABLED = True
PAYLOAD_STORAGE_MAX_BYTES = 65536
PAYLOAD_DIR_MODE = 0o750
PAYLOAD_FILE_MODE = 0o640

# Raw request bodies are stored as <payload-dir>/<sha256-prefix>/<sha256>.bin.
# Leave PAYLOAD_DIR as None to use <log-dir>/payloads. Docker sets
# WORDPOT_PAYLOAD_DIR=/opt/wordpot/logs/payloads, which lives inside the
# writable host-mounted log volume. No request path, upload filename, or
# user-controlled value is used in the payload filename. The default modes keep
# payloads private to the container user and its group, while allowing host-side
# analysis users in that group to read captured bodies.
PAYLOAD_DIR = None

# Structured honeypot events are written as JSONL. Use a dedicated filename so
# supervisor, Gunicorn, or T-Pot server logs can keep using wordpot.log.
EVENT_LOG_FILE = 'wordpot.json'

# Healthchecks should not pollute wordpot.json. Requests to these paths or with
# X-Wordpot-Healthcheck: 1 are ignored by the event logger when enabled.
EVENT_LOG_EXCLUDE_HEALTHCHECKS = True
EVENT_LOG_EXCLUDE_PATHS = ['/healthz']

# Optional overrides for event destination fields. Leave these as None unless
# Wordpot runs behind NAT or a reverse proxy and Flask cannot see the public
# listener IP/port. Without overrides, dest_ip skips wildcard bind addresses
# such as 0.0.0.0 and falls back to concrete WSGI host metadata or trusted
# proxy headers when TRUST_PROXY_HEADERS is enabled.
EVENT_DEST_IP = None
EVENT_DEST_PORT = None

# Profile selection:
#   startup    Pick one profile when the app starts and keep it for all clients.
#              On the next process/container start, the next profile is used.
#              This is the recommended default because a single deployment looks
#              like one coherent WordPress site.
#   per_ip_day Pick a profile per source IP and UTC day.
#   per_ip     Pick a stable profile per source IP.
#   first      Always use the first configured profile.
#
# Use PROFILE_ID to force one profile and disable rotation, for example:
#   PROFILE_ID = 'commerce'
#
# PROFILE_STATE_FILE stores the last startup profile id. Leave it as None to
# use <log-dir>/profile-state.json. In Docker this lives in /opt/wordpot/logs.
PROFILE_ROTATION = 'startup'
PROFILE_STATE_FILE = None
# PROFILE_ID = 'modern-business'

# Only enable this behind a trusted reverse proxy. If False, Wordpot uses the
# direct peer address and ignores X-Forwarded-* for security-sensitive behavior.
TRUST_PROXY_HEADERS = False

# -----------------------
# Wordpress configuration
# -----------------------

BLOGTITLE   = 'WordPress Site'      # Fallback title of the blog
BLOGSUBTITLE   = 'Just another WordPress site'    # Fallback subtitle
VERSION     = '7.0'                 # Fallback WordPress version to mimic
AUTHORS     = ['admin']             # Authors list

# Leave PROFILES unset to use the built-in profiles:
#   modern-business  WordPress 7.0 business site, modern default theme,
#                    Elementor/Yoast/forms/analytics/security plugins.
#   commerce         WordPress 7.0 shop with WooCommerce, cache, SMTP,
#                    backup/migration and SEO plugins.
#   maintenance-lag  WordPress 6.9.2 publisher site with legacy editor,
#                    migration/backup/cache and older-looking plugin mix.
#   agency-builder   WordPress 7.0 Elementor agency stack with add-ons,
#                    Rank Math, forms, Mailchimp, snippets and Duplicator.
#
# To define your own profiles, uncomment and adapt the shape below. Plugin and
# theme strings are resolved through the built-in catalog in wordpot/profiles.py.
#
# PROFILES = [
#     {
#         'id': 'example-site',
#         'blog_title': 'Example Site',
#         'blog_subtitle': 'Just another WordPress site',
#         'core_version': '7.0',
#         'server_header': 'Apache/2.4.58 (Ubuntu)',
#         'theme': 'twentytwentyfive',
#         'themes': ['twentytwentyfive', 'twentytwentyfour'],
#         'plugins': ['elementor', 'contact-form-7', 'wordpress-seo'],
#         'authors': [
#             {'id': 1, 'slug': 'admin', 'name': 'Admin'},
#             {'id': 2, 'slug': 'editor', 'name': 'Editor'},
#         ],
#         'locale': 'en_US',
#         'site_type': 'business',
#         'exposed_files': ['readme.html', 'license.txt', 'robots.txt'],
#     },
# ]

HPFEEDS_ENABLED = False
HPFEEDS_HOST = '127.0.0.1'
HPFEEDS_PORT = 10000
HPFEEDS_IDENT = 'wordpot'
HPFEEDS_SECRET = 'wordpot-pass'
HPFEEDS_TOPIC = 'wordpot.events'
